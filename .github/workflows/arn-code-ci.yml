name: arn-code CI

# The quick check of every PR (test of the required check; do not merge). The full test suite runs by hand: arn-code-full-tests.yml.

on:
  pull_request:
    paths:
      - "plugins/arn-code/**"
      - ".claude-plugin/marketplace.json"
      - "scripts/ci/**"
      - "tests/arn-code/**"
      - ".github/workflows/arn-code-ci.yml"
      - ".github/workflows/arn-code-full-tests.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks (frontmatter, references, presets, hooks)
        run: python3 scripts/ci/validate-arn-code.py
      - name: Shell syntax
        run: |
          for f in plugins/arn-code/hooks/*.sh plugins/arn-code/skills/*/scripts/*.sh tests/arn-code/*.sh; do
            bash -n "$f" || exit 1
          done
